        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        slug:
          type: string
          maxLength: 220
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
        city:
          type: string
          maxLength: 120
        address:
          type: string
          maxLength: 255
        country:
          type: string
          maxLength: 120
        star_rating:
          allOf:
          - $ref: '#/components/schemas/StarRatingEnum'
          minimum: 0
          maximum: 65535
        main_image:
          type: string
          readOnly: true
        amenities_list:
          type: array
          items:
            type: string
          readOnly: true
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        starting_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        room_types:
          type: array
          items:
            $ref: '#/components/schemas/RoomType'
          readOnly: true
        images:
          type: array
          items:
            $ref: '#/components/schemas/HotelImage'
          readOnly: true
      required:
      - amenities_list
      - city
      - id
      - images
      - main_image
      - name
      - room_types
      - starting_price
    HotelImage:
      type: object
      description: |-
        Provides a helper to turn a model's display_image (which may be a relative
        /media/ path or an absolute http URL) into an absolute URL using the request.
      properties:
        id:
          type: integer
          readOnly: true
        image:
          type: string
          readOnly: true
        caption:
          type: string
          maxLength: 150
      required:
      - id
      - image
    HotelList:
      type: object
      description: |-
        Provides a helper to turn a model's display_image (which may be a relative
        /media/ path or an absolute http URL) into an absolute URL using the request.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        slug:
          type: string
          maxLength: 220
          pattern: ^[-a-zA-Z0-9_]+$
        city:
          type: string
          maxLength: 120
        country:
          type: string
          maxLength: 120
        star_rating:
          allOf:
          - $ref: '#/components/schemas/StarRatingEnum'
          minimum: 0
          maximum: 65535
        main_image:
          type: string
          readOnly: true
        amenities_list:
